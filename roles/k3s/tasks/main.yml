---
- name: Install k3s
  shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Ensure /etc/rancher/k3s directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Grant read access to k3s.yaml for system users
  file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Wait for k3s node to be Ready
  command: kubectl get nodes
  register: k3s_nodes
  until: k3s_nodes.rc == 0
  retries: 10
  delay: 5