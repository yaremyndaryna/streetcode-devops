---
- name: Ensure target user has passwordless sudo access
  lineinfile:
    path: /etc/sudoers.d/{{ target_user }}
    line: "{{ target_user }} ALL=(ALL) NOPASSWD:ALL"
    state: present
    create: yes
    mode: '0440'
  become: true

- name: Update apt cache and install base dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - git
      - lsb-release
    state: present
    update_cache: yes