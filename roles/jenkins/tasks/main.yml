---
- name: Ensure Jenkins directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ jenkins_dir }}"
    - "{{ jenkins_home }}"

- name: Copy Jenkins setup files
  copy:
    src: "{{ item }}"
    dest: "{{ jenkins_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - Dockerfile
    - plugins.txt
    - jenkins.yaml

- name: Render docker-compose for Jenkins
  template:
    src: docker-compose.jenkins.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: '0600'

- name: Build and start Jenkins
  command: docker compose up -d --build
  args:
    chdir: "{{ jenkins_dir }}"