---
- name: Ensure ~/.ssh exists
  file:
    path: "/home/{{ target_user }}/.ssh"
    state: directory
    mode: '0700'
  become: false

- name: Generate SSH key for Jenkins deployment
  community.crypto.openssh_keypair:
    path: "/home/{{ target_user }}/.ssh/jenkins_deploy"
    type: ed25519
    comment: jenkins-deploy
  become: false

- name: Authorize SSH key for deploy user
  ansible.posix.authorized_key:
    user: "{{ target_user }}"
    key: "{{ lookup('file', '/home/' ~ target_user ~ '/.ssh/jenkins_deploy.pub') }}"
  become: false

- name: Create Jenkins directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - "{{ jenkins_dir }}"
    - "{{ jenkins_home }}"

- name: Copy Jenkins files
  copy:
    src: "{{ item }}"
    dest: "{{ jenkins_dir }}/{{ item }}"
    mode: '0644'
  loop: [Dockerfile, plugins.txt, jenkins.yaml]

- name: Render docker-compose for Jenkins
  template:
    src: docker-compose.jenkins.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: '0600'

- name: Build and start Jenkins
  command: docker compose up -d --build
  args:
    chdir: "{{ jenkins_dir }}"