systemMessage: "Streetcode CI/CD (Configured as Code)"
numExecutors: 2
securityRealm:
  local:
    allowsSignup: false
    users:
      - id: admin
        password: ${JENKINS_ADMIN_PASSWORD}
authorizationStrategy:
  loggedInUsersCanDoAnything:
    allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh"
              username: ${DEPLOY_USER}
              description: "SSH Key for Ansible Host Deployment"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy_ssh_key}"

          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub Access Token for GHCR and API"

jobs:
  - script: |
      pipelineJob('streetcode-pipeline') {
        definition {
          cpsScm {
            scm {
              git {
                remote { 
                  url(System.getenv('REPO_URL')) 
                }
                branch('*/' + System.getenv('REPO_BRANCH'))
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          scm('H/2 * * * *')
        }
      }