jenkins:
  systemMessage: "Streetcode CI/CD (Configured as Code for K3s)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub Access Token for GHCR and API"

jobs:
  - script: |
      pipelineJob('streetcode-pipeline') {
        definition {
          cpsScm {
            scm {
              git {
                remote { 
                  url(System.getenv('REPO_URL')) 
                }
                branch('*/' + System.getenv('REPO_BRANCH'))
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          scm('H/2 * * * *')
        }
      }