name: SonarCloud Code Analysis, Snyk & Trivy Security

on:
  push:
    branches:
      - main
      - jenkins
      - load-balancer
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build, Analyze & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"streetcode-devops" \
            /o:"yaremyndaryna" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"

      - name: Build Backend Project
        run: |
          dotnet build apps/backend/Streetcode/Streetcode.WebApi/Streetcode.WebApi.csproj --configuration Release

      - name: End SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: Install Frontend Dependencies
        run: |
          cd apps/frontend
          npm ci || npm install

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Security Scan (.NET Backend)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=apps/backend/Streetcode/Streetcode.sln --severity-threshold=high

      - name: Snyk Security Scan (Frontend Dependencies)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=apps/frontend/package.json --severity-threshold=high

      - name: Checkout load-balancer branch for Dockerfiles
        uses: actions/checkout@v3
        with:
          ref: load-balancer
          path: load-balancer-src

      - name: Build Backend Docker Image for Scan
        run: |
          docker build -t streetcode-backend:test \
            -f load-balancer-src/apps/backend/Dockerfile \
            load-balancer-src/apps/backend

      - name: Trivy Scan (Backend Docker Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'streetcode-backend:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Build Frontend Docker Image for Scan
        run: |
          docker build -t streetcode-frontend:test \
            -f load-balancer-src/apps/frontend/Dockerfile \
            load-balancer-src/apps/frontend

      - name: Trivy Scan (Frontend Docker Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'streetcode-frontend:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'