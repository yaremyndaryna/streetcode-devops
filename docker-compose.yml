services:
  streetcode-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: streetcode-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "${MS_SQL_DB_PORT}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - streetcode-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: streetcode-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - streetcode-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5


  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      
    container_name: streetcode-backend
    restart: unless-stopped
    environment:
      - STREETCODE_CORS__AllowedOrigins__0=http://localhost:3000
      - STREETCODE_CORS__AllowedOrigins__1=http://${HOST_IP}:3000
      - ASPNETCORE_ENVIRONMENT=Local
      - STREETCODE_ConnectionStrings__DefaultConnection=Server=streetcode-db,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${SA_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=true;Connect Timeout=60;
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "5000:5000"
    networks:
      - streetcode-net
    depends_on:
      streetcode-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
  
  streetcode-app-1:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
    container_name: streetcode-app-1
    restart: unless-stopped
    networks:
      - streetcode-net
    depends_on:
      - backend

  streetcode-app-2:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
    container_name: streetcode-app-2
    restart: unless-stopped
    networks:
      - streetcode-net
    depends_on:
      - backend

  nginx-lb:
    image: nginx:alpine
    container_name: streetcode-lb
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - streetcode-net
    depends_on:
      - streetcode-app-1
      - streetcode-app-2

volumes:
  mssql_data:
  redis_data:

networks:
  streetcode-net:
    driver: bridge
