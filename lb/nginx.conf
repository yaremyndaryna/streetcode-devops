events {
    worker_connections 1024;
}

http {
    upstream streetcode_app {
        server streetcode-app-1:80;
        server streetcode-app-2:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://streetcode_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}