global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter-app'
    static_configs:
      - targets: ['172.31.31.174:9100']

  - job_name: 'node-exporter-tools'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor-tools'
    static_configs:
      - targets: ['cadvisor:8080']