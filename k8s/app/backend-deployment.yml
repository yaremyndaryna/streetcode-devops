apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: streetcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/yaremyndaryna/streetcode-backend:latest
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: streetcode-secrets
                  key: DB_CONNECTION_STRING
            - name: Redis__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: streetcode-config
                  key: REDIS_HOST
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: streetcode
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080