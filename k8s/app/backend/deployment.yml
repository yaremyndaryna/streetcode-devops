apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: streetcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mssql-service 1433; do echo waiting for db; sleep 3; done']
      containers:
      - name: backend
        image: ghcr.io/yaremyndaryna/streetcode-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5000"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: streetcode-secrets
              key: DB_CONNECTION_STRING  
        - name: STREETCODE_ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: streetcode-secrets
              key: DB_CONNECTION_STRING
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
        readinessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10