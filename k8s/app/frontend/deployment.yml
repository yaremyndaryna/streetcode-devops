apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: streetcode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: frontend
        image: ghcr.io/yaremyndaryna/streetcode-frontend:latest
        ports:
        - containerPort: 3000